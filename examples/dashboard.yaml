# Example manual Lovelace view for Nursery Soother.
#
# Entity IDs are assigned by Home Assistant and can be renamed. Before pasting
# this view into a dashboard, replace every sample `nursery_soother_*` ID with
# the entity shown on the Nursery Soother device page. Also replace
# `camera.nursery` with the camera selected during setup.

title: Nursery
path: nursery
icon: mdi:baby-face-outline
cards:
  - type: picture-entity
    entity: camera.nursery
    name: Nursery camera
    camera_view: live
    show_name: true
    show_state: false

  - type: entities
    title: Nursery Soother
    show_header_toggle: false
    state_color: true
    entities:
      - entity: select.nursery_soother_level
        name: Soothing level
      - entity: switch.nursery_soother_automatic_operation
        name: Automatic operation
      - entity: switch.nursery_soother_level_lock
        name: Level lock
      - entity: sensor.nursery_soother_state
        name: State
      - entity: sensor.nursery_soother_recommendation
        name: Recommendation
      - entity: binary_sensor.nursery_soother_attention_required
        name: Attention required
      - entity: button.nursery_soother_simulate_cry_event
        name: Simulate cry event
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.nursery_soother_simulate_cry_event
          confirmation:
            text: Inject one test cry event that can notify parents or change the automatic level?

  - type: entities
    title: Level volumes and hard cap
    show_header_toggle: false
    entities:
      - entity: number.nursery_soother_baseline_volume
        name: Baseline
      - entity: number.nursery_soother_level_1_volume
        name: Level 1
      - entity: number.nursery_soother_level_2_volume
        name: Level 2
      - entity: number.nursery_soother_level_3_volume
        name: Level 3
      - entity: number.nursery_soother_level_4_volume
        name: Level 4
      - entity: number.nursery_soother_maximum_volume
        name: Maximum
