# Example manual Lovelace view for Nursery Soother.
#
# When Home Assistant's frontend is available, the optional custom card is
# served and loaded by the integration; no manual dashboard resource is needed.
# Entity IDs are assigned by Home Assistant and can be renamed. Before pasting
# this view into a dashboard, replace every sample `nursery_soother_*` ID with
# the entity shown on the Nursery Soother device page and replace
# `camera.nursery` with the configured camera. Update this YAML again after
# renaming any referenced entity.

title: Nursery
path: nursery
icon: mdi:baby-face-outline
cards:
  - type: custom:nursery-soother-card
    camera_entity: camera.nursery
    level_entity: select.nursery_soother_level
    automatic_entity: switch.nursery_soother_automatic_operation
    lock_entity: switch.nursery_soother_level_lock
    state_entity: sensor.nursery_soother_state
    recommendation_entity: sensor.nursery_soother_recommendation
    attention_entity: binary_sensor.nursery_soother_attention_required
    camera_view: live

  - type: entities
    title: Testing, level volumes, and hard cap
    show_header_toggle: false
    entities:
      - entity: button.nursery_soother_simulate_cry_event
        name: Simulate cry event
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.nursery_soother_simulate_cry_event
          confirmation:
            text: Inject one test cry event that can notify parents or change the automatic level?
      - entity: number.nursery_soother_baseline_volume
        name: Baseline
      - entity: number.nursery_soother_level_1_volume
        name: Level 1
      - entity: number.nursery_soother_level_2_volume
        name: Level 2
      - entity: number.nursery_soother_level_3_volume
        name: Level 3
      - entity: number.nursery_soother_level_4_volume
        name: Level 4
      - entity: number.nursery_soother_maximum_volume
        name: Maximum

# Native-card fallback: if you do not want to use the optional custom card,
# remove it above and uncomment this picture-entity card plus the entities card.
