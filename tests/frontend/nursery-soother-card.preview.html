<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nursery Soother card preview</title>
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: rgba(0, 0, 0, 0.87);
        --secondary-text-color: rgba(0, 0, 0, 0.62);
        --disabled-text-color: rgba(0, 0, 0, 0.28);
        --divider-color: rgba(0, 0, 0, 0.12);
        --card-background-color: #ffffff;
        --secondary-background-color: #e7eaee;
        --error-color: #e53935;
        --warning-color: #a66b00;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        color: var(--primary-text-color);
        background: #f4f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body.dark {
        --primary-text-color: rgba(255, 255, 255, 0.95);
        --secondary-text-color: rgba(255, 255, 255, 0.66);
        --disabled-text-color: rgba(255, 255, 255, 0.3);
        --divider-color: rgba(255, 255, 255, 0.15);
        --card-background-color: #1c1f26;
        --secondary-background-color: #11151b;
        --warning-color: #ffbd42;
        background: #111318;
      }

      main {
        width: min(100%, 340px);
        margin: 0 auto;
      }

      ha-card {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }

      .preview-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }

      .preview-controls button {
        padding: 7px 10px;
      }

      #log {
        min-height: 48px;
        overflow-wrap: anywhere;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="card-host"></div>
      <div class="preview-controls" aria-label="Preview states">
        <button type="button" data-testid="attention-demo">Attention</button>
        <button type="button" data-testid="recommendation-demo">Suggestion</button>
        <button type="button" data-testid="theme-demo">Theme</button>
      </div>
      <pre id="log" aria-live="polite"></pre>
    </main>

    <script type="module">
      const ids = {
        camera: "camera.nursery",
        level: "select.nursery_soother_level",
        baseline: "switch.nursery_soother_baseline_sound_preview",
        automatic: "switch.nursery_soother_automatic_operation",
        lock: "switch.nursery_soother_level_lock",
        state: "sensor.nursery_soother_state",
        recommendation: "sensor.nursery_soother_recommendation",
        attention: "binary_sensor.nursery_soother_attention_required",
      };

      let states = {
        [ids.camera]: {
          entity_id: ids.camera,
          state: "idle",
          attributes: { friendly_name: "Nursery camera" },
        },
        [ids.level]: { entity_id: ids.level, state: "level_1", attributes: {} },
        [ids.baseline]: { entity_id: ids.baseline, state: "off", attributes: {} },
        [ids.automatic]: { entity_id: ids.automatic, state: "off", attributes: {} },
        [ids.lock]: { entity_id: ids.lock, state: "off", attributes: {} },
        [ids.state]: {
          entity_id: ids.state,
          state: "cry_pending",
          attributes: { session_started_at: new Date(Date.now() - 83_000).toISOString() },
        },
        [ids.recommendation]: {
          entity_id: ids.recommendation,
          state: "increase_level",
          attributes: { suggested_level: "level_2" },
        },
        [ids.attention]: { entity_id: ids.attention, state: "off", attributes: {} },
      };

      const log = document.querySelector("#log");
      let card;

      function hass() {
        return {
          states,
          hassUrl: (path) => path,
          callService: async (domain, service, data) => {
            log.textContent = JSON.stringify({ domain, service, data }, null, 2);
            states = { ...states };
            if (domain === "select") {
              const wasStandby = states[ids.level].state === "standby";
              states[ids.level] = { ...states[ids.level], state: data.option };
              states[ids.baseline] = { ...states[ids.baseline], state: "off" };
              states[ids.state] = {
                ...states[ids.state],
                state: data.option === "standby" ? "standby" : "soothing",
                attributes: {
                  ...states[ids.state].attributes,
                  session_started_at:
                    data.option === "standby"
                      ? null
                      : wasStandby
                        ? new Date().toISOString()
                        : states[ids.state].attributes.session_started_at,
                },
              };
              states[ids.recommendation] = {
                ...states[ids.recommendation],
                state: "none",
                attributes: { suggested_level: null },
              };
            } else if (domain === "switch") {
              states[data.entity_id] = {
                ...states[data.entity_id],
                state: service === "turn_on" ? "on" : "off",
              };
            }
            card.hass = hass();
          },
        };
      }

      await import(
        "../../custom_components/nursery_soother/frontend/nursery-soother-card.js"
      );
      await customElements.whenDefined("nursery-soother-card");

      card = document.createElement("nursery-soother-card");
      card.setConfig({
        camera_entity: ids.camera,
        level_entity: ids.level,
        baseline_entity: ids.baseline,
        automatic_entity: ids.automatic,
        lock_entity: ids.lock,
        state_entity: ids.state,
        recommendation_entity: ids.recommendation,
        attention_entity: ids.attention,
      });
      card.hass = hass();
      card.addEventListener("hass-more-info", (event) => {
        log.textContent = `More info: ${event.detail.entityId}`;
      });
      document.querySelector("#card-host").append(card);

      document.querySelector("[data-testid='attention-demo']").addEventListener("click", () => {
        states = {
          ...states,
          [ids.level]: { ...states[ids.level], state: "level_2" },
          [ids.state]: { ...states[ids.state], state: "attention_required" },
          [ids.recommendation]: {
            ...states[ids.recommendation],
            state: "attend",
            attributes: { suggested_level: null },
          },
          [ids.attention]: { ...states[ids.attention], state: "on" },
        };
        card.hass = hass();
      });

      document.querySelector("[data-testid='recommendation-demo']").addEventListener("click", () => {
        states = {
          ...states,
          [ids.level]: { ...states[ids.level], state: "level_1" },
          [ids.state]: { ...states[ids.state], state: "cry_pending" },
          [ids.recommendation]: {
            ...states[ids.recommendation],
            state: "increase_level",
            attributes: { suggested_level: "level_2" },
          },
          [ids.attention]: { ...states[ids.attention], state: "off" },
        };
        card.hass = hass();
      });

      document.querySelector("[data-testid='theme-demo']").addEventListener("click", () => {
        document.body.classList.toggle("dark");
      });
    </script>
  </body>
</html>
