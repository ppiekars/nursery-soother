[project]
name = "nursery-soother"
version = "0.2.1"
description = "A conservative nursery response helper for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Patryk Piekarski" }]
dependencies = []

[dependency-groups]
dev = [
  "pre-commit",
  "pytest-cov",
  "pytest-homeassistant-custom-component==0.13.346",
  "ruff",
]

[tool.coverage.run]
branch = true
source = ["custom_components/nursery_soother"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
